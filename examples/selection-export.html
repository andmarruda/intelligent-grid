<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selection &amp; export · Intelligent Grid</title>
    <link rel="stylesheet" href="../dist/intelligent-grid.css">
    <link rel="stylesheet" href="./shared.css">
</head>
<body>
<main>
    <nav class="back"><a href="./index.html">← All examples</a></nav>
    <header>
        <h1>Selection &amp; export</h1>
        <p>Click a row to select it, Ctrl/Cmd+click to toggle, Shift+click for a range, or use the checkboxes (the header box selects every filtered row). Space toggles the active row and Ctrl+A selects all. Exports respect the current filters and sort.</p>
    </header>
    <div class="toolbar">
        <label>Mode <select id="mode"><option>multiple</option><option>single</option><option>none</option></select></label>
        <button id="paid">Mark selected as paid</button>
        <button id="csv">CSV of selected rows</button>
        <button id="csv-formatted">CSV formatted (as displayed)</button>
        <button id="xlsx">Excel: all rows, all columns</button>
        <button id="preview">Preview CSV (no download)</button>
    </div>
    <div id="grid"></div>
    <pre class="log" id="log"></pre>
</main>
<script src="../node_modules/sorla-db/dist/sorla.min.js"></script>
<script type="module">
    import { IntelligentGrid } from '../dist/index.js';
    import { orders, STATUS, logger } from './data.js';

    const log = logger(document.querySelector('#log'));
    const data = orders(150);
    let grid;

    function create(mode) {
        grid?.destroy();
        grid = new IntelligentGrid('#grid', {
            locale: 'en-US',
            idField: 'id',
            data,
            height: 380,
            selection: { mode, checkbox: true },
            navbar: {
                title: 'Orders',
                delete: true,
                export: ['csv', 'xlsx'],
                items: [{
                    label: 'Σ selected',
                    disabled: g => !g.getSelectedIds().length,
                    onClick: g => alert(g.getSelected().reduce((sum, row) => sum + row.qty * row.price, 0).toFixed(2))
                }]
            },
            columns: [
                { field: 'id', title: '#', type: 'integer', width: 70 },
                { field: 'product', title: 'Product' },
                { field: 'qty', title: 'Qty', type: 'integer', footer: 'sum' },
                { field: 'price', title: 'Price', type: 'currency', currency: 'USD' },
                { field: 'total', title: 'Total', type: 'currency', currency: 'USD', formula: '=[@qty]*[@price]', footer: 'sum' },
                { field: 'due', title: 'Due', type: 'date' },
                { field: 'paid', title: 'Paid', type: 'boolean', width: 80 },
                { field: 'status', title: 'Status', options: STATUS },
                { field: 'internal', title: 'Internal note', visible: false }
            ],
            on: {
                selectionChange: e => log('selectionChange', e.detail.ids.length, 'row(s)', e.detail.ids.slice(0, 10)),
                beforeExport: e => log('beforeExport', e.detail.format, e.detail.options),
                rowDelete: e => log('rowDelete', e.detail.ids)
            }
        });
        window.grid = grid;
    }

    const on = (id, fn) => document.querySelector(id).addEventListener('click', fn);
    document.querySelector('#mode').addEventListener('change', e => create(e.target.value));
    on('#paid', () => grid.getSelectedIds().forEach(id => grid.updateRow(id, { paid: true })));
    on('#csv', () => grid.exportCSV({ rows: 'selected', filename: 'selected-orders' }));
    on('#csv-formatted', () => grid.exportCSV({ formatted: true, filename: 'orders-formatted' }));
    on('#xlsx', () => grid.exportXLSX({ rows: 'all', columns: 'all', sheetName: 'All orders' }));
    on('#preview', () => log(grid.exportCSV({ download: false }).split('\r\n').slice(0, 4).join('\n')));
    create('multiple');
</script>
</body>
</html>
